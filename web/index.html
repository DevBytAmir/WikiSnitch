<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wikipedia, with a memory: paragraph history, trust badges, cross-language comparison and cited answers for Finnish Wikipedia." />
    <title>WikiSnitch</title>
    <script>
      // Apply the saved theme (or the system preference) before first paint. See src/lib/theme.ts.
      try {
        var saved = localStorage.getItem("wikisnitch-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
