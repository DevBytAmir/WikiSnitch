[project]
name = "wikisnitch"
version = "0.2.0"
description = "Paragraph-level edit history and cross-language comparison for Wikipedia, on MariaDB."
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "pymysql>=1.1",
    "pyarrow>=17",
    "requests>=2.32",
    "rapidfuzz>=3.9",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "pipeline", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
